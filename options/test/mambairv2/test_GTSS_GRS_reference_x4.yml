# Legacy GRS reference only. Fill path.pretrain_network_g AFTER GTSS training,
# before three-model comparison; unused by GTSS training and ordinary testing.
# GRS-MambaSR: full model, five standard datasets, original data paths.
name: test_v3.0_GRS_MambaSR_x4
model_type: GRSMambaIRv2Model
scale: 4
num_gpu: 1
manual_seed: 10

datasets:
  test_1:
    task: SR
    name: Set5
    type: RGBDepthPairedImageDataset
    dataroot_gt: [/home/BRAIN/xukai/datasets/M3SR/Set5/raw/Set5/Set5/original]
    dataroot_lq: [/home/BRAIN/xukai/datasets/M3SR/Set5/raw/Set5/Set5/LRbicx4]
    dataroot_depth: [/home/BRAIN/xukai/datasets/M3SR/Set5-Depth/X4]
    filename_tmpl: '{}'
    filename_tmpl_depth: '{}'
    depth_percentile_low: 0.02
    depth_percentile_high: 0.98
    depth_normalize_eps: 1.0e-6
    io_backend: {type: disk}
  test_2:
    task: SR
    name: Set14
    type: RGBDepthPairedImageDataset
    dataroot_gt: [/home/BRAIN/xukai/datasets/M3SR/Set14/HR]
    dataroot_lq: [/home/BRAIN/xukai/datasets/M3SR/Set14/LR_bicubic/X4]
    dataroot_depth: [/home/BRAIN/xukai/datasets/M3SR/Set14-Depth/X4]
    filename_tmpl: '{}x4'
    filename_tmpl_depth: '{}x4'
    depth_percentile_low: 0.02
    depth_percentile_high: 0.98
    depth_normalize_eps: 1.0e-6
    io_backend: {type: disk}
  test_3:
    task: SR
    name: B100
    type: RGBDepthPairedImageDataset
    dataroot_gt: [/home/BRAIN/xukai/datasets/M3SR/B100/HR]
    dataroot_lq: [/home/BRAIN/xukai/datasets/M3SR/B100/LR_bicubic/X4]
    dataroot_depth: [/home/BRAIN/xukai/datasets/M3SR/B100-Depth/X4]
    filename_tmpl: '{}x4'
    filename_tmpl_depth: '{}x4'
    depth_percentile_low: 0.02
    depth_percentile_high: 0.98
    depth_normalize_eps: 1.0e-6
    io_backend: {type: disk}
  test_4:
    task: SR
    name: Urban100
    type: RGBDepthPairedImageDataset
    dataroot_gt: [/home/BRAIN/xukai/datasets/M3SR/Urban100/HR]
    dataroot_lq: [/home/BRAIN/xukai/datasets/M3SR/Urban100/LR_bicubic/X4]
    dataroot_depth: [/home/BRAIN/xukai/datasets/M3SR/Urban100-Depth/X4]
    filename_tmpl: '{}x4'
    filename_tmpl_depth: '{}x4'
    depth_percentile_low: 0.02
    depth_percentile_high: 0.98
    depth_normalize_eps: 1.0e-6
    io_backend: {type: disk}
  test_5:
    task: SR
    name: Manga109
    type: RGBDepthPairedImageDataset
    dataroot_gt: [/home/BRAIN/xukai/datasets/M3SR/Manga109/HR]
    dataroot_lq: [/home/BRAIN/xukai/datasets/M3SR/Manga109/LR_bicubic/X4]
    dataroot_depth: [/home/BRAIN/xukai/datasets/M3SR/Manga109-Depth/X4]
    filename_tmpl: '{}_LRBI_x4'
    filename_tmpl_depth: '{}_LRBI_x4'
    depth_percentile_low: 0.02
    depth_percentile_high: 0.98
    depth_normalize_eps: 1.0e-6
    io_backend: {type: disk}

network_g:
  type: GRSMambaIRv2
  upscale: 4
  in_chans: 3
  img_size: 64
  img_range: 1.0
  embed_dim: 174
  d_state: 16
  depths: [6, 6, 6, 6, 6, 6]
  num_heads: [6, 6, 6, 6, 6, 6]
  window_size: 16
  inner_rank: 64
  num_tokens: 128
  convffn_kernel_size: 5
  mlp_ratio: 2.0
  upsampler: pixelshuffle
  resi_connection: 1conv

path:
  # Evaluate the full 500k GRS model; reject partial baseline-only checkpoints.
  pretrain_network_g: __SET_V3_0_GRS_CHECKPOINT_BEFORE_THREE_MODEL_COMPARISON__
  param_key_g: params
  strict_load_g: true

val:
  save_img: false
  suffix: ~
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 4
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: true

dist_params:
  backend: nccl
  port: 31004
